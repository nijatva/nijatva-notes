plugins {
    id 'com.android.application'
}

android {
    namespace 'in.devira.nijatva.notes'
    compileSdk 34

    defaultConfig {
        applicationId 'in.devira.nijatva.notes'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// Deliberately empty: the app runs on the framework alone, with no AndroidX,
// no GMS and no third-party libraries.
dependencies {
}
