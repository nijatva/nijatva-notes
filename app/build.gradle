plugins {
    id 'com.android.application'
}

android {
    namespace 'in.devira.nijatva.notes'
    compileSdk 34

    defaultConfig {
        applicationId 'in.devira.nijatva.notes'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// The one shared piece of the suite: nijatva-core's signature kit carries the
// Appearance and Developer screens plus the palette, so every Nijatva app reads
// the same. It is plain framework Java - no AndroidX, no Compose, no GMS.
dependencies {
    implementation 'com.nijatva:signature:1.0.0'
}
